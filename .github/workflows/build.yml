name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Chon Xcode 16 (can Swift 6)
        run: sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Phien ban toolchain
        run: swift --version

      - name: Build
        working-directory: macos
        run: swift build -c release

      - name: Kiem tra bo giai ma watermark
        working-directory: macos
        # Chi chay test thuan CPU tren CI. Cac test khac can Metal + Syphon
        # server that nen khong on dinh trong may ao.
        run: ./.build/release/TDRec --decodetest

      - name: Dong goi TDRec.app
        working-directory: macos
        run: ./build.sh

      - name: Kiem tra .app chay duoc
        working-directory: macos
        run: |
          test -x dist/TDRec.app/Contents/MacOS/TDRec
          test -f dist/TDRec.app/Contents/Resources/TDRec.icns
          ./dist/TDRec.app/Contents/MacOS/TDRec --decodetest

      - name: Nen lai
        working-directory: macos/dist
        # ditto giu nguyen quyen thuc thi va chu ky, zip thuong thi khong.
        run: ditto -c -k --sequesterRsrc --keepParent TDRec.app TDRec-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TDRec-macOS
          path: macos/dist/TDRec-macOS.zip

  # ─────────────────────────────────────────────────────────────────
  windows:
    name: Windows (MSVC x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cai ffmpeg (cho phep thu dau-cuoi)
        run: choco install ffmpeg -y --no-progress

      - name: Cau hinh CMake
        run: cmake -S windows -B build -DCMAKE_BUILD_TYPE=Release -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Chay 43 phep thu phan loi
        run: .\build\Release\tdrec_core_test.exe

      - name: Kiem tra tdrec.exe ton tai va chay duoc
        run: |
          .\build\Release\tdrec.exe --help
          .\build\Release\tdrec.exe --senders
        # --senders tra ve 1 khi khong co Spout sender nao (dung tren CI),
        # nen khong duoc de PowerShell coi do la loi.
        continue-on-error: true

      - name: Kiem tra exe van link dong CRT va co DLL di kem
        shell: pwsh
        # NGUOC voi v1.0.1: hoi do nhung CRT vao exe de khoi can VC++ Redist,
        # nhung exe phong len 349 KB voi bang import trong -> Defender chan
        # NGAY LUC TAI, nguoi dung khong lay noi file zip ve. Ban 92 KB link
        # dong thi tai binh thuong.
        #
        # Nen bay gio phai chan chieu nguoc lai: exe BUOC PHAI con link dong,
        # va cac DLL runtime phai nam canh no.
        run: |
          $exe = ".\build\Release\tdrec.exe"
          $dumpbin = (Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1).FullName
          if ($dumpbin) {
            # Out-String BAT BUOC: -match/-notmatch tren MANG la toan tu LOC,
            # tra ve mang cac dong khop chu khong phai true/false. Mang khong
            # rong luon tinh la dung -> if() bao loi nguoc hoan toan.
            $deps = (& $dumpbin /dependents $exe) | Out-String
            Write-Host $deps
            if ($deps -notmatch 'VCRUNTIME140') {
              Write-Error "tdrec.exe dang nhung CRT -- se bi Defender chan luc tai. Xem CMakeLists."
              exit 1
            }
            Write-Host "OK: tdrec.exe con link dong CRT"
          }

          $kb = [math]::Round((Get-Item $exe).Length / 1KB)
          Write-Host "Kich thuoc tdrec.exe: $kb KB"
          if ($kb -gt 220) {
            Write-Error "tdrec.exe phong bat thuong ($kb KB) -- dau hieu CRT bi nhung lai"
            exit 1
          }

          foreach ($d in @('VCRUNTIME140.dll','MSVCP140.dll')) {
            if (-not (Test-Path ".\build\Release\$d")) {
              Write-Error "Thieu $d canh exe -- may chua cai VC++ Redist se khong chay duoc"
              exit 1
            }
          }
          Write-Host "OK: DLL runtime da nam canh exe"

      - name: Kiem tra exe vao duoc menu khi bam dup
        shell: pwsh
        # Bam dup tu Explorer -> console chi co mot process gan vao ->
        # LaunchedFromExplorer() tra true -> vao menu thay vi in usage roi
        # dong cua so ngay. Mo exe bang Start-Process (khong ke thua console
        # cua runner) de gia lap dung tinh huong do.
        run: |
          $p = Start-Process -FilePath ".\build\Release\tdrec.exe" -PassThru
          Start-Sleep -Seconds 3
          if ($p.HasExited) {
            Write-Error "Bam dup xong exe tu thoat ngay -- menu khong bat"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "OK: bam dup thi exe o lai trong menu"

      - name: Gom file
        run: |
          mkdir dist
          copy build\Release\tdrec.exe dist\
          copy build\Release\tdrec_core_test.exe dist\
          copy build\Release\*.dll dist\
          copy windows\README.md dist\
          copy macos\td\tdrec_watermark.frag dist\

      - uses: actions/upload-artifact@v4
        with:
          name: TDRec-Windows
          path: dist/

  # ─────────────────────────────────────────────────────────────────
  release:
    name: Tao ban phat hanh
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Dong goi lai ban Windows
        run: |
          cd artifacts/TDRec-Windows
          zip -r ../../TDRec-Windows.zip .
          cd ../..
          cp artifacts/TDRec-macOS/TDRec-macOS.zip .

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            TDRec-macOS.zip
            TDRec-Windows.zip
          generate_release_notes: true
